[project]
name = "nvme-disk-mon-build-script"
version = "0.1.0"
description = "Isolated Python 3.14 build driver for NVMe-Disk-Mon"
requires-python = ">=3.14"
dependencies = [
  "certifi==2026.7.22",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]
