[project]
name = "nvme-disk-mon-deploy-system"
version = "0.2.0"
description = "Declarative source deployment controller for NVMe-Disk-Mon"
requires-python = ">=3.14"
dependencies = [
  "certifi==2026.7.22",
  "jsonschema==4.26.0",
  "referencing==0.37.0",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]
allowed-confusables = ["，", "：", "；", "（", "）"]
